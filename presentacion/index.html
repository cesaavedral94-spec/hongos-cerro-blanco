<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hongos del bosque seco tropical de Guayaquil · Carlos Saavedra</title>
<style>
:root{--carbon:#000;--plate:#e5e7eb;--chalk:#f4f4f4;--white:#fff;--lime:#e2ff70;--grey:#6b6b6b;--k:1;
  --ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d4d4d4;color:var(--carbon);overflow:hidden;
  font-family:"Neue Haas Grotesk Display Pro","Neue Haas Grotesk Text Pro","NHaasGroteskDSPro-55Rg","Neue Haas Grotesk","Haas Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-0.02em}
a{color:inherit;text-decoration:none}

/* ── PRESENTACION: cada slide ocupa la pantalla y se recorre de arriba abajo ── */
#deck{position:fixed;left:0;right:0;top:0;bottom:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y}
#pages{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 40px 60px;width:max-content;min-width:100%}
.slide{width:var(--pw);height:calc(var(--pw) * 9 / 16);flex:none;position:relative;overflow:hidden;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.18),0 6px 22px rgba(0,0,0,.14)}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform:scale(var(--k));transform-origin:0 0}

/* aparicion al entrar a la slide */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform 1.1s var(--ease)}
.slide.on .rv{opacity:1;transform:none}
.slide.on .rv.d1{transition-delay:.12s}.slide.on .rv.d2{transition-delay:.24s}
.slide.on .rv.d3{transition-delay:.36s}.slide.on .rv.d4{transition-delay:.48s}

/* ── HONGOS FLOTANTES (mismo sistema que index.html del sitio) ── */
.obj{position:absolute;cursor:pointer;opacity:0;transform:translateY(40px) scale(.94);
  transition:opacity 1s var(--ease),transform 1.2s var(--ease)}
.slide.on .obj{opacity:1;transform:none}
.obj .dr{width:100%;height:100%;animation:drift var(--dur,15s) ease-in-out var(--del,0s) infinite}
.obj img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .35s var(--ease);
  -webkit-user-drag:none;user-select:none}
.obj:hover{z-index:60!important}
.obj:hover .dr{animation-play-state:paused}
.obj:hover img{transform:scale(1.07)}
@keyframes drift{
  0%,100%{transform:translate(0,0) rotate(var(--r,0deg))}
  33%{transform:translate(var(--dx,6px),var(--d,-26px)) rotate(calc(var(--r,0deg) + var(--rb,2deg)))}
  66%{transform:translate(calc(var(--dx,6px) * -1),calc(var(--d,-26px) * -0.45)) rotate(calc(var(--r,0deg) - var(--rb,2deg)))}}
.nombre{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--carbon);color:#fff;
  font-size:15px;letter-spacing:-0.03em;line-height:1;padding:7px 12px;border-radius:999px;white-space:nowrap;
  font-style:italic;opacity:0;transition:opacity .18s;pointer-events:none}
.obj.bajo .nombre{top:auto;bottom:-34px}
.obj:hover .nombre{opacity:1}

/* logos */
.logos{position:absolute;inset:0;z-index:50;pointer-events:none}
.logos img{position:absolute;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 14px #fff)}
.logos .vl{position:absolute;width:1.4px;background:#000}

/* ── TITULO EN CAJAS (como el logo) ── */
.tit{position:absolute;left:0;right:0;top:300px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:14px}
.tbox{background:#000;color:#fff;font-size:104px;line-height:1.24;padding:0 30px;letter-spacing:-0.035em;
  white-space:nowrap;transition:background .25s,color .25s}
.tit a:hover .tbox{background:var(--lime);color:#000}
.esq{position:absolute;z-index:85;font-size:15px;letter-spacing:-0.03em;line-height:1.3;
  text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff,0 0 8px #fff,0 0 10px #fff}


/* ── STATEMENT ── */
.stmt{position:absolute;left:108px;top:150px;width:1380px;font-size:100px;line-height:1.08;letter-spacing:-0.04em}
.stmt .w{display:inline-block;opacity:0;transform:translateY(.4em);transition:opacity .7s var(--ease),transform .9s var(--ease)}
.slide.on .stmt .w{opacity:1;transform:none}
.bar{position:absolute;left:108px;top:642px;height:11px;width:0;background:var(--lime);transition:width 1.2s var(--ease) .9s}
.slide.on .bar{width:108px}
.cap{position:absolute;left:108px;top:678px;width:940px;font-size:21px;line-height:1.35;color:var(--grey)}

/* ── CABECERA DE SLIDES ── */
.h1{position:absolute;left:54px;top:34px;font-size:34px;font-weight:500;letter-spacing:-0.03em}
.hd{position:absolute;left:648px;top:40px;width:900px;font-size:19px;line-height:1.35;color:var(--grey)}
.hint{position:absolute;left:54px;bottom:26px;font-size:15px;color:var(--grey)}

/* ── CUADRICULA DE CAPTURAS ── */
.grid{position:absolute;inset:0}
.card{position:absolute;cursor:zoom-in;outline:1px solid #d9d9d9;background:#fff;
  transition:transform .55s var(--ease),box-shadow .55s var(--ease),opacity .4s;opacity:0}
.slide.on .card{opacity:1}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card .lg{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:center;opacity:0;transition:opacity .25s .1s}
.card .lg span{background:#000;color:#fff;font-size:7.4px;line-height:1.2;padding:4px 7px;border-radius:999px;text-align:center}
.card:hover{transform:scale(var(--hz,2.15));z-index:20;box-shadow:0 12px 36px rgba(0,0,0,.22);outline-color:#000}
.card:hover .lg{opacity:1}
.grid:hover .card:not(:hover){opacity:.35}

/* ── MAPAS BASE ── */
.strips{position:absolute;left:54px;right:54px;top:138px;height:690px;display:flex;gap:30px}
.strip{flex:1;position:relative;transition:flex .7s var(--ease);cursor:zoom-in;min-width:0}
.strip .im{height:648px;outline:1px solid #d9d9d9;overflow:hidden}
.strip img{width:100%;height:100%;object-fit:cover;object-position:60% 50%;transition:transform .9s var(--ease)}
.strip .t{margin-top:16px;font-size:22px;font-weight:500;white-space:nowrap}
.strips:hover .strip{flex:.75}
.strips .strip:hover{flex:2.2}
.strip:hover img{transform:scale(1.04)}

/* ── PALETA ── */
.pal{position:absolute;left:54px;right:54px;top:210px;display:flex}
.sw{flex:1;position:relative;cursor:copy}
.sw .box{height:360px;display:flex;align-items:flex-end;justify-content:center}
.sw .m{transition:transform .5s var(--ease);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-position:center bottom;mask-position:center bottom}
.sw .ol{filter:drop-shadow(0 0 .7px #8a8a8a) drop-shadow(0 0 .7px #8a8a8a)}
.sw .fl{animation:drift var(--dur,16s) ease-in-out var(--del,0s) infinite;--d:-14px;--dx:5px;--r:0deg}
.sw:hover .fl{animation-play-state:paused}
.sw:hover .m{transform:scale(1.14) translateY(-10px)}
.sw .nm{margin-top:34px;font-size:23px;font-weight:500}
.sw .hx{font-size:18px;margin-top:4px;font-variant-numeric:tabular-nums}
.sw .us{font-size:16px;color:var(--grey);margin-top:4px}
.sw .ok{position:absolute;left:50%;top:150px;transform:translate(-50%,8px);background:#000;color:#fff;font-size:15px;
  padding:7px 12px;border-radius:999px;opacity:0;transition:opacity .2s,transform .3s var(--ease);pointer-events:none;white-space:nowrap}
.sw:hover .ok{opacity:1;transform:translate(-50%,0)}

/* ── FLUJO ── */
#flow{position:absolute;left:144px;top:118px;width:1312px;height:738px;overflow:visible}
#flow text{font-family:"Neue Haas Grotesk Display Pro","Neue Haas Grotesk Text Pro","NHaasGroteskDSPro-55Rg","Neue Haas Grotesk","Haas Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:22px;fill:#111;letter-spacing:-0.3px}
#flow .lb{filter:url(#halo)}
#flow .g{fill:#8a8a8a;font-size:18px}
#flow .nd{cursor:pointer}
#flow .nd .sh{transition:transform .35s var(--ease);transform-box:fill-box;transform-origin:center}
#flow .nd.act .sh{transform:scale(1.35)}
#flow .nd.act polygon.sh,#flow .nd.act rect.sh{fill:var(--lime)}
#flow polyline{fill:none;stroke:#111;stroke-width:1.6;transition:stroke .2s,stroke-width .2s}
#flow polyline.dash{stroke-dasharray:7 6}
#flow polyline.hl{stroke-width:2.6}
#prev{position:absolute;z-index:90;width:420px;pointer-events:none;opacity:0;transform:translateY(10px) scale(.96);
  transition:opacity .25s,transform .35s var(--ease)}
#prev.on{opacity:1;transform:none}
#prev .im{background:#fff;outline:1px solid #000;box-shadow:0 14px 40px rgba(0,0,0,.2)}
#prev img{display:block;width:100%}
#prev .c{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#prev .c b{background:#000;color:#fff;font-weight:400;font-size:15px;padding:7px 12px;border-radius:999px}
#prev .c i{font-style:normal;font-size:14px;background:var(--lime);padding:7px 12px;border-radius:999px}



/* ── FICHA TECNICA (cajetin de plano) ── */
.caj{position:absolute;left:54px;right:54px;top:138px;display:grid;grid-template-columns:repeat(6,1fr);
  grid-template-rows:150px 170px 132px 112px;border:2.4px solid #000;background:#000;gap:1px}
.cl{background:#fff;padding:16px 18px;position:relative;transition:background .25s}
.cl:hover{background:#fbffe6}
.cl .lb{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--grey);margin-bottom:10px;display:flex;justify-content:space-between}
.cl .lb i{font-style:normal;color:#b5b5b5}
.cl .v{font-size:21px;line-height:1.28;letter-spacing:-0.02em}
.cl .v.xl{font-size:44px;line-height:1.02;letter-spacing:-0.035em}
.cl .v small{display:block;font-size:16px;color:var(--grey);margin-top:6px}
.cl ul{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:0 26px}.cl li{font-size:19px;line-height:1.42}
.cl li{border-top:1px solid #000;padding-top:10px;font-size:20px;line-height:1.25}
.cl .sws{display:flex;gap:6px;margin-top:4px}.cl .sws b{width:26px;height:26px;outline:1px solid #9a9a9a}
.cl a:hover{text-decoration:underline}
.tick{position:absolute;width:18px;height:18px;border:0 solid #000}

/* ── FUNCIONES ── */
.fx{position:absolute;left:54px;top:118px;width:720px}
.fr{display:flex;gap:18px;align-items:flex-start;padding:13px 14px;margin-left:-14px;border-radius:10px;cursor:default;
  transition:background .25s}
.fr svg{flex:none;margin-top:2px}
.fr polygon{fill:#fff;stroke:#111;stroke-width:1.6;transition:fill .25s}
.fr.on polygon{fill:var(--lime)}
.fr.on{background:#f6f6f6}
.fr b{display:block;font-weight:500;font-size:25px;letter-spacing:-0.03em}
.fr span{display:block;font-size:17px;color:var(--grey);margin-top:3px;line-height:1.3}
.fxp{position:absolute;left:820px;top:170px;width:726px}
.fxp .im{outline:1px solid #000;box-shadow:0 14px 40px rgba(0,0,0,.16);background:#fff;aspect-ratio:1527/789;overflow:hidden}
.fxp img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0;transition:opacity .25s}
.fxp .c{margin-top:14px;display:inline-block;background:#000;color:#fff;font-size:16px;padding:7px 13px;border-radius:999px}

/* cierre */
.ver{position:absolute;left:552px;width:498px;top:806px;text-align:center;font-size:20px;z-index:85;
  text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff,0 0 8px #fff,0 0 10px #fff}
.ver:hover{text-decoration:underline}

/* ── NAVEGACION ── */

/* ── VISOR DE SECCION (presentacion vertical dentro de la presentacion) ── */
#viewer{position:fixed;inset:0;z-index:300;background:rgba(255,255,255,.97);opacity:0;pointer-events:none;
  transition:opacity .35s}
#viewer.on{opacity:1;pointer-events:auto}
#vlist{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
#vlist::-webkit-scrollbar{display:none}
.vs{height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px}
.vs img{max-width:88vw;max-height:76vh;outline:1px solid #000;box-shadow:0 20px 60px rgba(0,0,0,.18);
  opacity:0;transform:translateY(30px) scale(.97);transition:opacity .6s,transform .8s var(--ease)}
.vs.on img{opacity:1;transform:none}
.vs .vc{display:flex;gap:10px;align-items:center;font-size:17px}
.vs .vc b{font-weight:400;background:#000;color:#fff;padding:7px 13px;border-radius:999px}
.vs .vc span{color:var(--grey);font-variant-numeric:tabular-nums}
#vclose{position:fixed;top:20px;right:20px;width:42px;height:42px;border-radius:50%;border:0;background:var(--lime);
  font-size:22px;cursor:pointer;z-index:310}
#vhint{position:fixed;left:24px;top:24px;font-size:15px;color:var(--grey);z-index:310}
#vdots{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:310}
#vdots i{width:7px;height:7px;border-radius:50%;background:#cfcfcf;transition:background .2s,transform .2s}
#vdots i.on{background:#000;transform:scale(1.3)}

#scrollhint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);font-size:15px;color:var(--grey);z-index:90;
  animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){.obj .dr,.sw .fl{animation:none}#deck,#vlist{scroll-behavior:auto}}
</style>
</head>
<body>

<main id="deck"><div id="pages"></div></main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Sección">
  <div id="vhint">Desplázate ↑ ↓ · Esc para cerrar</div>
  <button id="vclose" aria-label="Cerrar">×</button>
  <div id="vdots"></div>
  <div id="vlist"></div>
</div>

  s.innerHTML=`<div class="box"><div class="fl" style="--dur:${15+i*1.6}s;--del:${-i*2.1}s;--rb:${1.2+i%3}deg">
   <div class="${light?'ol':''}"><div class="m" data-f="${f}" style="background:${hx};-webkit-mask-image:url(${Hm(f)});mask-image:url(${Hm(f)})"></div></div></div></div>
   <div class="nm">${n}</div><div class="hx">${hx}</div><div class="us">${u}</div><div class="ok">Clic para copiar ${hx}</div>`;
  s.onclick=async()=>{const ok=s.querySelector('.ok');try{await navigator.clipboard.writeText(hx);ok.textContent='Copiado '+hx}
   catch(e){ok.textContent=hx}setTimeout(()=>ok.textContent='Clic para copiar '+hx,1400)};
  w.appendChild(s)});
 st.appendChild(w);
 // tamaño de cada silueta segun la proporcion de su imagen
 w.querySelectorAll('.m').forEach(m=>{const im=new Image();im.onload=()=>{const k=Math.min(240/im.width,300/im.height);
  m.style.width=im.width*k+'px';m.style.height=im.height*k+'px'};im.src=Hm(m.dataset.f)})}

/* 7 · FLUJO */
st=slide('flujo');
st.insertAdjacentHTML('beforeend',`<div class="h1 rv">Flujo de la data</div>
 <svg id="flow" viewBox="0 0 1600 900" class="rv d2"></svg><div id="prev"><div class="im"><img alt=""></div><div class="c"><b></b><i>clic → ver sección</i></div></div>`);

/* 8 · CIERRE */
st=slide('cierre');hongos(st,DATA.L[2]);logos(st);
st.insertAdjacentHTML('beforeend',`<a class="ver" href="${SITE}" target="_blank" rel="noopener">Ver la página →</a>`);

/* ── FLUJO: nodos que flotan, lineas que los siguen y vista previa por cercania ── */
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('flow'),N=DATA.nodes;
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
svg.insertAdjacentHTML('afterbegin',`<defs><filter id="halo" x="-5%" y="-25%" width="110%" height="150%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="d"/><feFlood flood-color="#fff"/>
  <feComposite in2="d" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`);
const gL=mk('g',{}),gN=mk('g',{}),gT=mk('g',{});svg.append(gL,gN,gT);
function pth(a,b,k){const dx=b[0]-a[0],dy=b[1]-a[1];if(k=='l')return[a,b];
  if(k=='h')return[a,[a[0]+.18*dx,a[1]+.5*dy],[a[0]+.6*dx,a[1]+.5*dy],b];
  return[a,[a[0]+.5*dx,a[1]+.18*dy],[a[0]+.5*dx,a[1]+.6*dy],b]}
const EX=[{a:'hov',b:'H3',mid:[[495,760],[695,560]],off:[-15,25],lab:'clic → su ficha (?sp=)',lx:435,ly:745},
          {a:'H3',b:'H2',mid:[[775,300],[435,255]],off:[0,0],lab:'Info ↗',lx:615,ly:268}];
DATA.edges.forEach(e=>{e.el=mk('polyline',{class:e.d?'dash':''});gL.appendChild(e.el);
  if(e.lab){e.t=mk('text',{class:'lb g','text-anchor':'middle'});e.t.textContent=e.lab;gT.appendChild(e.t)}});
EX.forEach(e=>{e.el=mk('polyline',{class:'dash'});gL.appendChild(e.el);const t=mk('text',{class:'lb g','text-anchor':'middle',x:e.lx,y:e.ly});
  t.textContent=e.lab;gT.appendChild(t)});
const hexa=r=>[...Array(6)].map((_,i)=>`${(r*Math.cos(i*Math.PI/3)).toFixed(1)},${(r*Math.sin(i*Math.PI/3)).toFixed(1)}`).join(' ');
Object.entries(N).forEach(([id,n],i)=>{
  const g=mk('g',{class:'nd'});n.g_=g;n.ph=i*1.7;n.ph2=i*2.3;n.amp=n.s=='hex'||n.s=='flor'?5:7;
  let sh;
  if(n.s=='hex'){sh=mk('polygon',{points:hexa(24),fill:'#fff',stroke:'#111','stroke-width':1.6,class:'sh'});g.append(sh);
    const t=mk('text',{y:7,'text-anchor':'middle',style:'font-size:18px;pointer-events:none'});t.textContent=n.num;g.append(t)}
  else if(n.s=='sq'||n.s=='sqdot'){sh=mk('rect',{x:-18,y:-18,width:36,height:36,fill:'#fff',stroke:'#111','stroke-width':1.6,class:'sh'});g.append(sh);
    if(n.s=='sqdot')g.append(mk('circle',{r:3.5,fill:'#777'}))}
  else if(n.s=='tri'){sh=mk('polygon',{points:'0,-22 22,16 -22,16',fill:'#fff',stroke:'#111','stroke-width':1.6,class:'sh'});g.append(sh)}
  else if(n.s=='dot'){sh=mk('circle',{r:19,fill:'#111',class:'sh'});g.append(sh,mk('circle',{r:4,fill:'#fff'}))}
  else{sh=mk('g',{class:'sh'});for(let a=0;a<360;a+=40){const r=a*Math.PI/180;
    sh.append(mk('circle',{cx:15*Math.cos(r),cy:15*Math.sin(r),r:9,fill:'#e2ff70',stroke:'#111','stroke-width':1.6}))}
    sh.append(mk('circle',{r:15,fill:'#e2ff70'}));g.append(sh)}
  const ty=n.s=='flor'?56:46;
  n.lines.forEach((l,j)=>{const t=mk('text',{class:'lb',y:ty+j*27,'text-anchor':'middle'});t.textContent=l;g.append(t)});
  if(n.sub){const t=mk('text',{class:'lb g',y:ty+n.lines.length*27-2,'text-anchor':'middle'});t.textContent=n.sub;g.append(t)}
  g.addEventListener('click',()=>openViewer(n.g,n.shot));
  gN.appendChild(g)});
let T0=performance.now(),flowOn=false;
function pos(id){const n=N[id],t=(performance.now()-T0)/1000;
  return[n.x+n.amp*Math.sin(t*.55+n.ph),n.y+n.amp*Math.cos(t*.43+n.ph2)]}
function frame(){
  if(flowOn){
    const P={};for(const id in N){P[id]=pos(id);N[id].g_.setAttribute('transform',`translate(${P[id][0].toFixed(1)},${P[id][1].toFixed(1)})`)}
    DATA.edges.forEach(e=>{const p=pth(P[e.a],P[e.b],e.k);e.el.setAttribute('points',p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '));
      if(e.t){e.t.setAttribute('x',((p[1][0]+p[2][0])/2).toFixed(0));e.t.setAttribute('y',(p[1][1]-10).toFixed(0))}});
    EX.forEach(e=>{const a=P[e.a],b=[P[e.b][0]+e.off[0],P[e.b][1]+e.off[1]];
      e.el.setAttribute('points',[a,...e.mid,b].map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '))});
    if(act)placePrev(act);
  }
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

const prev=document.getElementById('prev'),pimg=prev.querySelector('img'),pcap=prev.querySelector('b');
const FS=1312/1600,FX=144,FY=118;let act=null;
function placePrev(id){const p=pos(id),sx=FX+p[0]*FS,sy=FY+p[1]*FS,w=420,h=w*789/1527+56;
  let x=sx<800?sx+46:sx-46-w,y=Math.max(20,Math.min(880-h,sy-h/2));prev.style.left=x+'px';prev.style.top=y+'px'}
function setAct(id){if(id===act)return;
  if(act){N[act].g_.classList.remove('act');DATA.edges.forEach(e=>{if(e.a==act||e.b==act)e.el.classList.remove('hl')})}
  act=id;
  if(!id){prev.classList.remove('on');return}
  N[id].g_.classList.add('act');DATA.edges.forEach(e=>{if(e.a==id||e.b==id)e.el.classList.add('hl')});
  pimg.src=S(N[id].shot);pcap.textContent=DATA.cap[N[id].shot];placePrev(id);prev.classList.add('on')}
const fstage=document.getElementById('flujo').querySelector('.stage');
fstage.addEventListener('mousemove',ev=>{const r=fstage.getBoundingClientRect(),k=r.width/1600;
  const mx=(ev.clientX-r.left)/k,my=(ev.clientY-r.top)/k;let best=null,bd=70;
  for(const id in N){const p=pos(id),d=Math.hypot(FX+p[0]*FS-mx,FY+p[1]*FS-my);if(d<bd){bd=d;best=id}}
  setAct(best)});
fstage.addEventListener('mouseleave',()=>setAct(null));
fstage.addEventListener('click',ev=>{if(act&&!ev.target.closest('.nd'))openViewer(N[act].g,N[act].shot)});
// precarga de pantallazos del flujo
Object.values(N).forEach(n=>{const i=new Image();i.src=S(n.shot)});

/* ── VISOR TIPO PDF: paginas blancas, zoom con pellizco, todo sigue en movimiento ── */
const slides=[...document.querySelectorAll('.slide')];
const root=document.documentElement;let Z=1,base=1000,cur=0;
function fitBase(){base=Math.max(320,Math.min(innerWidth-120,(innerHeight-56)*16/9))}
function apply(){const pw=base*Z;root.style.setProperty('--pw',pw+'px');root.style.setProperty('--k',pw/1600);}
function setZoom(z,ax,ay){z=Math.max(.35,Math.min(4,z));if(Math.abs(z-Z)<1e-4)return;
  const r=deck.getBoundingClientRect();if(ax==null){ax=r.width/2;ay=r.height/2}
  const f=z/Z,cx=deck.scrollLeft+ax,cy=deck.scrollTop+ay;Z=z;apply();
  deck.scrollLeft=cx*f-ax;deck.scrollTop=cy*f-ay}
fitBase();apply();
addEventListener('resize',()=>{const t=deck.scrollTop/Math.max(1,deck.scrollHeight);fitBase();apply();deck.scrollTop=t*deck.scrollHeight});
// pellizco en trackpad (Chrome/Edge/Firefox mandan wheel + ctrlKey)
deck.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey||e.altKey))return;e.preventDefault();const r=deck.getBoundingClientRect();
  const dy=Math.max(-25,Math.min(25,e.deltaY));setZoom(Z*Math.exp(-dy*.01),e.clientX-r.left,e.clientY-r.top)},{passive:false});
// pellizco en trackpad de Safari
let gz=1;// ── MOUSE: doble clic acerca/ajusta, arrastrar desplaza la hoja ampliada ──
const INTER='a,button,.obj,.card,.strip,.sw,.nd,.fr,#viewer';
deck.addEventListener('dblclick',e=>{if(e.target.closest(INTER))return;e.preventDefault();
  const r=deck.getBoundingClientRect();
  if(Z>1.05)setZoom(1,e.clientX-r.left,e.clientY-r.top);else setZoom(2.2,e.clientX-r.left,e.clientY-r.top)});
let pan=null,panMoved=false;
deck.addEventListener('mousedown',e=>{
  const mid=e.button===1,free=e.button===0&&Z>1.05&&!e.target.closest(INTER);
  if(!mid&&!free)return;e.preventDefault();
  pan={x:e.clientX,y:e.clientY,sl:deck.scrollLeft,st:deck.scrollTop};panMoved=false;deck.style.cursor='grabbing'});
addEventListener('mousemove',e=>{if(!pan)return;const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
  if(Math.abs(dx)+Math.abs(dy)>3)panMoved=true;
  deck.scrollLeft=pan.sl-dx;deck.scrollTop=pan.st-dy});
addEventListener('mouseup',()=>{if(!pan)return;pan=null;deck.style.cursor=Z>1.05?'grab':''});
deck.addEventListener('click',e=>{if(panMoved){e.stopPropagation();e.preventDefault();panMoved=false}},true);
const _apply=apply;apply=function(){_apply();deck.style.cursor=Z>1.05?'grab':''};
document.addEventListener('gesturestart',e=>{e.preventDefault();gz=Z});
document.addEventListener('gesturechange',e=>{e.preventDefault();const r=deck.getBoundingClientRect();
  setZoom(gz*e.scale,e.clientX-r.left,e.clientY-r.top)});
// pellizco con dos dedos en pantalla tactil
let t0=null;
deck.addEventListener('touchstart',e=>{if(e.touches.length==2){const[a,b]=e.touches;
  t0={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:Z}}},{passive:true});
deck.addEventListener('touchmove',e=>{if(e.touches.length==2&&t0){e.preventDefault();const[a,b]=e.touches,r=deck.getBoundingClientRect();
  setZoom(t0.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/t0.d,(a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top)}},{passive:false});
deck.addEventListener('touchend',e=>{if(e.touches.length<2)t0=null});
function fitZoom(){const p=cur;Z=1;apply();deck.scrollLeft=0;go(p,'auto')}

function go(i,beh){i=Math.max(0,Math.min(slides.length-1,i));
  deck.scrollTo({top:slides[i].offsetTop-20,behavior:beh||'smooth'})}
function upd(){const mid=deck.scrollTop+deck.clientHeight/2;let bi=0,bd=1e9;
  slides.forEach((s,i)=>{const d=Math.abs(s.offsetTop+s.offsetHeight/2-mid);if(d<bd){bd=d;bi=i}});
  cur=bi}
deck.addEventListener('scroll',upd,{passive:true});upd();
// cada pagina se anima al entrar en pantalla y sigue moviendose mientras se ve
const io=new IntersectionObserver(es=>es.forEach(e=>{e.target.classList.toggle('on',e.isIntersecting);
  if(e.target.id==='flujo'){flowOn=e.isIntersecting;if(!flowOn)setAct(null)}}),{root:deck,threshold:.12});
slides.forEach(s=>io.observe(s));

/* ── VISOR DE SECCION ── */
const viewer=document.getElementById('viewer'),vlist=document.getElementById('vlist'),vdots=document.getElementById('vdots');
let vOpen=false,vio=null;
function openViewer(g,start){const ks=DATA.groups[g];vlist.innerHTML='';vdots.innerHTML='';
  ks.forEach((k,i)=>{const s=el('div','vs');s.innerHTML=`<img src="${S(k)}" alt="${DATA.cap[k]}">
   <div class="vc"><b>${DATA.cap[k]}</b><span>${String(i+1).padStart(2,'0')} / ${String(ks.length).padStart(2,'0')}</span></div>`;
   vlist.appendChild(s);vdots.appendChild(el('i'))});
  viewer.classList.add('on');vOpen=true;setAct(null);
  const idx=Math.max(0,ks.indexOf(start));vlist.style.scrollBehavior='auto';vlist.scrollTop=idx*vlist.clientHeight;vlist.style.scrollBehavior='';
  if(vio)vio.disconnect();
  vio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=[...vlist.children].indexOf(e.target);
    [...vlist.children].forEach(s=>s.classList.toggle('on',s===e.target));[...vdots.children].forEach((d,j)=>d.classList.toggle('on',j===i))}}),
    {root:vlist,threshold:.55});
  [...vlist.children].forEach(s=>vio.observe(s))}
function closeViewer(){viewer.classList.remove('on');vOpen=false}
document.getElementById('vclose').onclick=closeViewer;
function vgo(d){const i=Math.round(vlist.scrollTop/vlist.clientHeight)+d;vlist.scrollTo({top:Math.max(0,i)*vlist.clientHeight})}

addEventListener('keydown',e=>{
  const nx=['ArrowDown','ArrowRight','PageDown',' '].includes(e.key),pv=['ArrowUp','ArrowLeft','PageUp'].includes(e.key);
  if(vOpen){if(e.key==='Escape')closeViewer();else if(nx){e.preventDefault();vgo(1)}else if(pv){e.preventDefault();vgo(-1)}return}
  if((e.metaKey||e.ctrlKey)&&(e.key==='='||e.key==='+')){e.preventDefault();setZoom(Z*1.25);return}
  if((e.metaKey||e.ctrlKey)&&e.key==='-'){e.preventDefault();setZoom(Z/1.25);return}
  if((e.metaKey||e.ctrlKey)&&e.key==='0'){e.preventDefault();fitZoom();return}
  if(!e.metaKey&&!e.ctrlKey&&!e.altKey){if(e.key==='+'||e.key==='='){setZoom(Z*1.25);return}
    if(e.key==='-'||e.key==='_'){setZoom(Z/1.25);return}if(e.key==='0'){fitZoom();return}}
  if(['PageDown',' '].includes(e.key)||(e.key==='ArrowRight')){e.preventDefault();go(cur+1)}
  else if(['PageUp'].includes(e.key)||e.key==='ArrowLeft'){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1)});
</script>
